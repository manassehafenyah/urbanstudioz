<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Smell &amp; Aura</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300&display=swap">
<style>
:root{--ink:#08070A;--gold:#D9B45B;--gold-lt:#F2DFA4;--text:#EDE7DC;--muted:#9C9285;--line:rgba(217,180,91,.2)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--ink);color:var(--text);
  font-family:"Jost","Helvetica Neue",Arial,sans-serif;font-weight:300;
  display:grid;place-items:center;padding:2rem;text-align:center;
  background-image:radial-gradient(60% 50% at 50% 40%,rgba(217,180,91,.10),transparent 70%);
}
img{width:96px;height:96px;object-fit:contain;margin:0 auto 1.5rem}
.eyebrow{font-family:"Cinzel",Georgia,serif;font-size:.66rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(2.4rem,7vw,4rem);line-height:1.05;margin:1rem 0 .5rem;color:#FFF7EA}
h1 em{font-style:italic;color:var(--gold-lt)}
p{color:var(--muted);max-width:38ch;margin:0 auto 2rem;font-size:.95rem}
a{
  display:inline-block;text-decoration:none;color:#160F03;border-radius:2px;
  background:linear-gradient(100deg,#A07E38,var(--gold) 45%,var(--gold-lt));
  padding:1rem 2rem;font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;
  box-shadow:0 8px 30px -14px rgba(217,180,91,.9);transition:transform .2s;
}
a:hover{transform:translateY(-2px)}
a:focus-visible{outline:2px solid var(--gold-lt);outline-offset:3px}
@media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main>
    <img src="apple-touch-icon.png" alt="Smell &amp; Aura">
    <span class="eyebrow">Error 404</span>
    <h1>This scent has <em>faded</em>.</h1>
    <p>The page you were looking for isn't here. The catalogue, however, is exactly where you left it.</p>
    <a href="/">Back to the catalogue</a>
  </main>
</body>
</html>
